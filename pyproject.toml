[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dalal-jamm"
version = "0.1.0"
description = "Aide à la décision pour la mammographie - CHN Dalal Jamm (Master 2 IDIA)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true          # un test xfail qui passe devient une erreur : retirez alors le marqueur xfail
addopts = "-ra"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
